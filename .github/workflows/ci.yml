name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://gaplens:ci-only-not-a-secret@localhost:5432/gaplens
      # Tests replace this with a random value; it only has to exist for the app to start.
      JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gaplens
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: gaplens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaplens -d gaplens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
      # Advisory until the dependency set settles; make it blocking in Sprint 4.
      - run: pip-audit
        continue-on-error: true

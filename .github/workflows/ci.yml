name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # A normal run takes about a minute. Without a limit a stuck job holds a runner for six hours.
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+asyncpg://gaplens:ci-only-not-a-secret@localhost:5432/gaplens
      # Tests replace this with a random value; it only has to exist for the app to start.
      JWT_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gaplens
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: gaplens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gaplens -d gaplens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      # Install exactly what the lock file says; pip refuses a package whose hash differs.
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      # Fails when pyproject.toml changed and the lock files were not regenerated with make lock.
      - run: make lock PIP_COMPILE=pip-compile
        working-directory: .
      - run: git diff --exit-code backend/requirements.txt backend/requirements-dev.txt
        working-directory: .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
      # Advisory until the dependency set settles; make it blocking in Sprint 4.
      - run: pip-audit -r requirements-dev.txt
        continue-on-error: true
        # It queries a remote database and has no timeout of its own.
        timeout-minutes: 5

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          # The same Node as local development, so a problem cannot hide behind a version gap.
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm ci installs exactly what package-lock.json says and fails if it disagrees.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Advisory until the dependency set settles; make it blocking in Sprint 4.
      - run: npm audit --audit-level=high
        continue-on-error: true
        timeout-minutes: 5

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_${GITLEAKS_VERSION}_checksums.txt on the release page. Update both together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Full history, so a secret that was committed and later deleted is still found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary is used directly: the gitleaks-action needs a license for organization
      # accounts and would be one more third-party action running with the repository token.
      - run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      # --redact keeps a matched value out of the public CI log.
      - run: ./gitleaks git --redact --verbose .
